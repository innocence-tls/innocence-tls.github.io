desc: >
  Продолжение Putrika 1st.

  Главный герой - обычный портной с тёмным прошлым, прибывает в столицу Ильварент - город,
  где безраздельно властвует Церковь Белого Нефрита. Но на улицах города орудует
  безжалостный убийца, чьи жертвы - исключительно священнослужители. Оказавшись меж
  церковных интриг и кровавой охоты маньяка, герой вступает на путь, который не сулит
  ничего, кроме гибели и кровавой трагедии...
