desc: >
  Ремейк культовой новеллы, идейного прародителя Subarashiki Hibi.

  Загадочная смерть школьницы порождает волну безумия. По классам расползаются слухи о
  грядущем конце света, предсказанном Нострадамусом. Окружающие стремительно теряют рассудок
  и сбиваются в агрессивную секту, ведомую одним из учеников, объявившим себя истинным
  Спасителем...
note: |
  В отличие от ремейка 2020 года, данное издание [2025] является ультимативным. Обновлена графика (некоторые спрайты и новые иллюстрации), улучшена режиссура, добавлены новые сцены и переработан интерфейс.
  За основу был взят перевод от Maid-Mania: https://t.me/maidmania/16 и перенесен на новую версию игры.
  Нами же переведены новые сцены, интерфейс и некоторая графика.
