desc: >
  Новелла от создателей Kara no Shoujo.

  Япония, 1951 год. Главный герой работает частным детективом и расследует исчезновение
  девушки из знатного рода. В ее поместье он встречает девушку, как две капли воды похожую
  на его бывшую возлюбленную. Она умоляет найти ее пропавшую сестру-близнеца, но след ведет
  к круговороту кровавого безумия и серии жестоких убийств...
