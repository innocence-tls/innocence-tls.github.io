desc: >
  Продолжение легендарной новеллы 'Sakura no Uta'.

  Главный герой и его спутница прибывают в загадочный город, скрывающий нерассказанные
  истории. Это сага о наследии гениальных художников, чьи полотна до сих пор будоражат умы.
  Судьбы героев сплетаются в сложный узор из амбиций, личных драм и раздумий о природе
  истинной красоты...

  Время течет и однажды становится поэзией. Время Сакуры становится стихами...
