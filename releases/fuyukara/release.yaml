desc: >
  В изолированной школе живут бессмертные девушки в вечном цикле взросления и омоложения.
  Покинуть это место можно лишь получив признание извне. Убийства здесь обычное дело,
  но однажды находят обезглавленное тело одной из девушек. Прятать голову строгое табу,
  мешающее воскрешению. Если её не найдут за два дня, она погибнет навсегда,
  а покой школы будет нарушен...
note: |
  Это цикл новелл: Harumade, Kururu (1), Natsukumo Yururu (2), Akiyume Kukuru (3, перевод от A\M), Fuyukara, Kururu. (4, наш перевод).
  Сделано по спецзаказу.
