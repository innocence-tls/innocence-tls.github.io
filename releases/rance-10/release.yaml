desc: >
  Люди и монстры делили Континент, сохраняя хрупкое равновесие на протяжении более тысячи
  лет, но в один миг всё рухнуло.

  Сильнейший Демонлорд, Кейблис, захватил власть в Царстве Тьмы и повёл колоссальное войско
  на вторжение в земли людей. Человеческие государства, погрязнув в междоусобицах, не смогли
  объединиться и были безжалостно раздавлены.

  Спустя всего две недели после начала войны число погибших среди человечества достигло
  примерно 12 000 000 человек.

  И всё же человечество не могло сплотиться, а разногласия между мировыми лидерами лишь
  продолжали расти. В тот самый момент, когда худший сценарий - полная гибель человечества -
  тяжёлым грузом давил на разум каждого...

  'Просто подчинитесь мне все до единого. Я без проблем разгромлю эту Армию Тьмы'

  Это был Ранс, только что вернувшийся из очередного приключения со своей спутницей Силл
  Плейн.

  Среди мировых лидеров поднялся переполох:

  Королева Королевства Леазас — Лия Парапара Леазас.

  Принцесса Королевства Зес — Магик Ганди.

  Президент Республики Гельман — Шейла Гельман.

  Представитель Вольных Городов — Копандон Дотт.

  Правительница восточного острова ЯПОНИИ - Ода Коу.

  Глава крупнейшей в мире религии, Церкви АЛИСЫ — Её Преосвященство Крук Мофус.

  ...И все они также были женщинами Ранса, поэтому они согласились. Ранс стал Господарем
  человечества и его последней надеждой.

  На протяжении шести тысяч лет крошечное существо по имени Кейблис сражалось и убивало,
  прокладывая себе путь сквозь черепа и груды трупов, на самую вершину Царства Тьмы.

  Тщеславный брутальный воин по имени Ранс, объявивший своей собственностью всех женщин
  мира, жил беззаботной жизнью и в итоге возглавил мир людей. Теперь оба они ставят на кон
  выживание своих рас в неизбежной смертельной схватке, что решит исход континента...
note: |
